services:
  mysql:
    image: mysql:8.4
    container_name: teatro-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: teatro
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      # 3306 por padrão; defina MYSQL_PORT no .env se a porta já estiver em uso
      # (ex.: um MySQL instalado na máquina). O backend deve usar a mesma porta.
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Cria o banco teatro_test (usado pelos testes) na primeira inicialização.
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
